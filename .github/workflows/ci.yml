# =============================================================================
# gif — Continuous Integration
#
# Runs on every pull request and on every push to main:
#   - fast-checks:        typecheck, lint, build, dist/ in sync, vectors,
#                         npm audit (production dependencies)
#   - integration:        full test suite against a fresh docker compose stack
#   - integration-canary: the same suite on the ubuntu-26.04 runner image;
#                         allowed to fail, never blocks a merge
#
# fast-checks fails the PR on any obvious source-level issue without spending
# time on the integration tests. The integration jobs run in parallel.
#
# Runner image: both required jobs are pinned to `ubuntu-24.04` so the image
# changes only when this file changes, not when GitHub retargets the
# `ubuntu-latest` label (it rolls to 26.04 from 2026-10-19). The canary keeps
# a continuous record of the suite on the next image; when it has been green
# long enough, move the pin here deliberately.
#
# The job names "Fast checks" and "Integration tests" are required status
# checks in the `main` ruleset. Renaming either one stalls every PR until the
# ruleset is updated to match.
#
# Third-party actions are pinned to a commit SHA (the trailing comment is the
# tag that SHA was taken from); .github/dependabot.yml keeps them current.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow only reads the repository; nothing here writes to it, comments,
# or publishes. Narrow the default GITHUB_TOKEN grant accordingly.
permissions:
  contents: read

jobs:

  fast-checks:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: dist/ in sync with src/
        run: |
          # dist/ is git-tracked — adopters import gif-enforcement from it
          # without building. A src/ change whose rebuilt output was not
          # committed, or a new module whose dist files were never added,
          # ships adopters a package that does not load.
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::mcp-server/dist is out of sync with src — run 'npm run build' and commit dist/ (including new files)"
            git status --porcelain -- dist
            exit 1
          fi

      - name: Audit record contract vectors
        run: npm run vectors

      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Build, start the stack, run the suite, tear down
        uses: ./.github/actions/integration-stack

  integration-canary:
    name: Integration tests (ubuntu-26.04 canary)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Informational only. A red canary is a signal to look at before moving the
    # pin above, not a reason to hold a merge.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Build, start the stack, run the suite, tear down
        uses: ./.github/actions/integration-stack
