# =============================================================================
# gif — integration stack (composite action)
#
# Brings up the docker compose stack from a fresh checkout, runs the full
# integration suite against it, and tears it down. Used by three jobs in
# .github/workflows/ci.yml — the required "Integration tests" job, the
# ubuntu-26.04 canary and the postgres-18 leg — so the steps exist once and
# cannot drift between them.
#
# The two inputs select the PostgreSQL image and its data mount point; both
# default to empty, which leaves the compose defaults (postgres:16-alpine at
# /var/lib/postgresql/data) in force.
#
# The calling job must have run actions/checkout and actions/setup-node first;
# this action holds only `run` steps on purpose (no `uses:`), so every pinned
# third-party action stays in ci.yml where Dependabot tracks it.
# =============================================================================

name: Integration stack
description: Build, start the compose stack, run ./scripts/test-local.sh, tear down.

inputs:
  postgres-image:
    description: >-
      Image for the postgres service (written to .env as GIF_POSTGRES_IMAGE).
      Empty keeps the compose default, postgres:16-alpine.
    required: false
    default: ''
  postgres-data-dir:
    description: >-
      Mount point of the postgres_data volume inside the container (written to
      .env as GIF_POSTGRES_DATA_DIR). Empty keeps the compose default,
      /var/lib/postgresql/data. The official 18+ images need /var/lib/postgresql.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      working-directory: mcp-server
      run: npm ci

    - name: Build
      shell: bash
      working-directory: mcp-server
      run: npm run build

    - name: Create .env from .env.example
      shell: bash
      # The inputs reach the script through env, not by splicing the
      # expression into the script body.
      env:
        INPUT_POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        INPUT_POSTGRES_DATA_DIR: ${{ inputs.postgres-data-dir }}
      run: |
        cp .env.example .env
        # Substitute real (random) values for CI. None of these leave the runner.
        {
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
          echo "GIF_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          echo "GIF_APP_PASSWORD=$(openssl rand -hex 16)"
          echo "IDENTITY_HMAC_SECRET=$(openssl rand -hex 32)"
          echo "PGDATABASE=gif"
          echo "PGPORT_HOST=5432"
          echo "PORT=3100"
          # Only when the calling job selects a PostgreSQL image; otherwise the
          # compose defaults apply.
          if [ -n "$INPUT_POSTGRES_IMAGE" ]; then
            echo "GIF_POSTGRES_IMAGE=$INPUT_POSTGRES_IMAGE"
          fi
          if [ -n "$INPUT_POSTGRES_DATA_DIR" ]; then
            echo "GIF_POSTGRES_DATA_DIR=$INPUT_POSTGRES_DATA_DIR"
          fi
        } > .env

    - name: Start docker compose stack
      shell: bash
      run: docker compose up -d --build

    # The two wait loops below run under `bash -e -o pipefail` (that is what
    # `shell: bash` means in a composite action). Keep pipelines out of the
    # `if` conditions: with pipefail, `curl -f … | grep` fails on a 4xx even
    # when grep matches, and `… | grep -q` can fail on SIGPIPE when grep
    # exits early.
    - name: Wait for postgres init to complete
      shell: bash
      run: |
        # init-db.sh applies all migrations on first start; poll the logs
        # until the success line appears or we hit a 60s timeout.
        for i in $(seq 1 60); do
          if [[ "$(docker compose logs postgres 2>&1)" == *"GIF Init Complete"* ]]; then
            echo "postgres init complete"
            exit 0
          fi
          sleep 1
        done
        echo "postgres did not finish init within 60s"
        docker compose logs postgres
        exit 1

    - name: Report PostgreSQL version
      shell: bash
      # Evidence in the job log of which server major the suite ran against.
      # Diagnostic only: it must never be the reason a required check fails.
      run: docker compose exec -T postgres postgres --version || echo "(version report unavailable)"

    - name: Wait for mcp-server to accept connections
      shell: bash
      run: |
        # GET /mcp answers 405 once the server is up (the endpoint is POST);
        # any 2xx/4xx means it is listening. "000" = connection refused.
        for i in $(seq 1 30); do
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3100/mcp 2>/dev/null || true)"
          if [[ "$code" =~ ^[24] ]]; then
            echo "mcp-server is reachable (HTTP $code)"
            exit 0
          fi
          sleep 1
        done
        echo "mcp-server not reachable within 30s"
        docker compose logs mcp-server
        exit 1

    - name: Run integration tests
      shell: bash
      run: ./scripts/test-local.sh

    - name: Dump logs on failure
      if: failure()
      shell: bash
      run: |
        echo "=== postgres logs ==="
        docker compose logs postgres
        echo "=== mcp-server logs ==="
        docker compose logs mcp-server

    - name: Tear down docker compose stack
      if: always()
      shell: bash
      run: docker compose down -v
